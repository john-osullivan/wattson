[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wattson"
version = "0.1.0"
description = "WATTSON ETK typed contracts: generated Pydantic models."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wattson*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
