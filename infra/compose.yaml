version: "3.9"
services:
  agent-core:
    build: ./docker/agent-core
    env_file: ../.env
    volumes:
      - ${WATTSON_VAULT}:/vault:rw
      - ../ontology:/ontology:ro
      - ../schema:/schema:ro
    command: ["sleep","infinity"] # replace with your runner or supervisor
  api:
    build: ./docker/api
    env_file: ../.env
    ports: ["8088:8088"]
