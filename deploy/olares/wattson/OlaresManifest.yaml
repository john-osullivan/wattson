apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: wattson
  appid: wattson
  title: WATTSON
  description: WATTSON Phase 0 test skeleton - heartbeat container with persisted app data and inference backend wiring.
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  version: 0.0.1
  categories:
  - Utilities
spec:
  versionName: "0.0.1"
  runAsUser: true
  supportArch:
  - amd64
  requiredCpu: 10m
  limitedCpu: 100m
  requiredMemory: 16Mi
  limitedMemory: 64Mi
  requiredDisk: 100Mi
permission:
  appData: true
options:
  dependencies:
  - name: olares
    version: '>=1.12.6-0'
    type: system
workloadReplicas:
  wattson: 1
  terminal: 1
entrances:
- name: terminal
  host: terminal
  port: 80
  title: WATTSON Terminal
  openMethod: window
envs:
# Local inference backend: the shared app `llamacppqwen3827bggufv3`
# (llama.cpp serving Qwen3.8-27B, OpenAI-compatible /v1) runs in the
# cluster-wide namespace `llamacppqwen3827bggufv3-shared`; its Model
# Console service is `download-svc` on port 8090 (verified via
# `olares-cli market get` entrance `download-svc:8090` and the app's
# service template). In-cluster DNS is the preferred route.
# Fallback (public entrance, only if the in-cluster route is unavailable):
# https://366ada1d.app.on.bigrock.dev/v1
- envName: WATTSON_MODEL_BASE_URL
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: "http://download-svc.llamacppqwen3827bggufv3-shared.svc.cluster.local:8090/v1"
  description: OpenAI-compatible base URL of the local inference backend (no API key needed for the local model).
- envName: WATTSON_MODEL_NAME
  required: true
  type: string
  editable: true
  applyOnChange: true
  default: "unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL"
  description: Model name advertised by the inference backend.
